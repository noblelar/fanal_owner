name: Fanal_Owner - Build & Deploy AWS EC2 via SSM

on:
  push:
    branches: ["master"]

env:
  IMAGE: fanalarkgroup/fanal_owner
  REGISTRY: docker.io
  TAG_SHA: ${{ github.sha }}
  TAG_LATEST: latest

concurrency:
  group: fanal-owner-production
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Owner application
        run: |
          npm run lint
          npm run typecheck
          npm run test:documentation
          npm run test:documentation:e2e
          npm run build

  build-push:
    needs: quality
    runs-on: ubuntu-latest
    environment: production_env
    outputs:
      image_digest: ${{ steps.deployment-image.outputs.registry_digest }}
      version: ${{ steps.app-version.outputs.version }}
      revision: ${{ github.sha }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read application version
        id: app-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_sha_tag=${VERSION}-sha.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push owner image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.app-version.outputs.version_sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG_LATEST }}

      - name: Resolve immutable deployment image
        id: deployment-image
        shell: bash
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
        run: |
          REGISTRY_DIGEST=""
          for attempt in {1..12}; do
            if MANIFEST=$(docker buildx imagetools inspect "$SOURCE_IMAGE" --format '{{json .Manifest}}' 2>/dev/null); then
              REGISTRY_DIGEST=$(jq -er '.digest' <<< "$MANIFEST" 2>/dev/null || true)
              if [[ "$REGISTRY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
            fi
            echo "Waiting for registry manifest (attempt $attempt/12)..."
            sleep 5
          done

          if [[ ! "$REGISTRY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Registry digest unavailable::Could not resolve a pullable digest for $SOURCE_IMAGE."
            exit 1
          fi

          IMAGE_REF="${REGISTRY}/${IMAGE}@${REGISTRY_DIGEST}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "registry_digest=$REGISTRY_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Immutable deployment image: $IMAGE_REF"

      - name: Summarize published Owner image
        shell: bash
        run: |
          echo "### Published Fanal Owner image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application version: \`${{ steps.app-version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable version tag: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.app-version.outputs.version_sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit tag: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Buildx output digest: \`${{ steps.build-image.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry-resolved digest: \`${{ steps.deployment-image.outputs.registry_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production deployment reference: \`${{ steps.deployment-image.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compatibility tag retained: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG_LATEST }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production_env

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send SSM command to deploy owner app
        id: ssm
        shell: bash
        env:
          DEPLOY_SERVICE: owner
          DEPLOY_DIGEST: ${{ needs.build-push.outputs.image_digest }}
          EXPECTED_VERSION: ${{ needs.build-push.outputs.version }}
          EXPECTED_REVISION: ${{ needs.build-push.outputs.revision }}
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_DIGEST:?DEPLOY_DIGEST is empty}"
          : "${EXPECTED_VERSION:?EXPECTED_VERSION is empty}"
          : "${EXPECTED_REVISION:?EXPECTED_REVISION is empty}"

          if [[ ! "$DEPLOY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid deployment digest: $DEPLOY_DIGEST"
            exit 1
          fi

          DEPLOY_IMAGE="${REGISTRY}/${IMAGE}@${DEPLOY_DIGEST}"

          printf -v REMOTE_COMMAND \
            'sudo -iu ubuntu /home/ubuntu/fanal/scripts/deploy-component.sh %q %q %q %q' \
            "$DEPLOY_SERVICE" \
            "$DEPLOY_IMAGE" \
            "$EXPECTED_VERSION" \
            "$EXPECTED_REVISION"

          PARAMETERS=$(jq -cn \
            --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          echo "Sending immutable Owner deployment"
          echo "Digest: $DEPLOY_DIGEST"
          echo "Version: $EXPECTED_VERSION"
          echo "Revision: $EXPECTED_REVISION"

          if ! SEND_RESULT=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy immutable Fanal owner image $EXPECTED_REVISION" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 1200 \
            --output json 2>&1); then
            echo "::error::AWS SSM send-command failed"
            echo "$SEND_RESULT"
            exit 1
          fi

          COMMAND_ID=$(jq -r '.Command.CommandId // empty' <<< "$SEND_RESULT")

          if [[ -z "$COMMAND_ID" ]]; then
            echo "::error::AWS SSM did not return a command ID"
            echo "$SEND_RESULT"
            exit 1
          fi

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "SSM command sent: $COMMAND_ID"

      - name: Wait for SSM command result
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${COMMAND_ID:?COMMAND_ID is empty}"

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          for attempt in {1..120}; do
            if ! INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>&1); then

              if grep -q "InvocationDoesNotExist" <<< "$INVOCATION"; then
                echo "Waiting for the SSM invocation to become available..."
                sleep 10
                continue
              fi

              echo "::error::Unable to retrieve the SSM invocation"
              echo "$INVOCATION"
              exit 1
            fi

            STATUS=$(jq -r '.Status // empty' <<< "$INVOCATION")
            STATUS_DETAILS=$(jq -r '.StatusDetails // empty' <<< "$INVOCATION")

            echo "Current status: ${STATUS:-unknown} (${STATUS_DETAILS:-no details})"

            case "$STATUS" in
              Success)
                echo "----- SSM stdout -----"
                jq -r '.StandardOutputContent // empty' <<< "$INVOCATION"
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "::error::SSM deployment failed: ${STATUS_DETAILS:-$STATUS}"

                echo "----- SSM stdout -----"
                jq -r '.StandardOutputContent // empty' <<< "$INVOCATION"

                echo "----- SSM stderr -----"
                jq -r '.StandardErrorContent // empty' <<< "$INVOCATION"

                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling)
                ;;

              *)
                echo "::warning::Unexpected SSM status: $STATUS ($STATUS_DETAILS)"
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for SSM command completion"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true

          exit 1
