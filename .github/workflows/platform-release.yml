name: Coordinate Fanal Platform Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy/verify the test candidate, promote the identical candidate, or roll back
        required: true
        default: deploy-candidate
        type: choice
        options:
          - deploy-candidate
          - verify-candidate
          - promote-candidate
          - rollback-candidate
      platform_version:
        description: Stable platform SemVer (X.Y.Z); not required for rollback
        required: false
        type: string
      api_image:
        description: Exact API image (docker.io/fanalarkgroup/fanalapi@sha256:...)
        required: false
        type: string
      api_version:
        description: API Semantic Version
        required: false
        type: string
      api_revision:
        description: Full 40-character API Git revision
        required: false
        type: string
      main_image:
        description: Exact Main image (docker.io/fanalarkgroup/fanal@sha256:...)
        required: false
        type: string
      main_version:
        description: Main Semantic Version
        required: false
        type: string
      main_revision:
        description: Full 40-character Main Git revision
        required: false
        type: string
      owner_image:
        description: Exact Owner image (docker.io/fanalarkgroup/fanal_owner@sha256:...)
        required: false
        type: string
      owner_version:
        description: Owner Semantic Version
        required: false
        type: string
      owner_revision:
        description: Full 40-character Owner Git revision
        required: false
        type: string
      confirm_operation:
        description: Confirm this platform operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: fanal-platform-release
  cancel-in-progress: false

jobs:
  coordinate:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment: platform_release_env

    steps:
      - name: Require explicit confirmation
        shell: bash
        env:
          CONFIRMED: ${{ inputs.confirm_operation }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Platform operations must be dispatched from the Owner master branch."
            exit 1
          fi
          if [[ "$CONFIRMED" != "true" ]]; then
            echo "::error::Run the workflow again and select confirm_operation."
            exit 1
          fi

      - name: Checkout coordinator
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: inputs.operation != 'rollback-candidate'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create and validate deterministic platform manifest
        if: inputs.operation != 'rollback-candidate'
        shell: bash
        env:
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          API_IMAGE: ${{ inputs.api_image }}
          API_VERSION: ${{ inputs.api_version }}
          API_REVISION: ${{ inputs.api_revision }}
          MAIN_IMAGE: ${{ inputs.main_image }}
          MAIN_VERSION: ${{ inputs.main_version }}
          MAIN_REVISION: ${{ inputs.main_revision }}
          OWNER_IMAGE: ${{ inputs.owner_image }}
          OWNER_VERSION: ${{ inputs.owner_version }}
          OWNER_REVISION: ${{ inputs.owner_revision }}
        run: |
          set -Eeuo pipefail
          node scripts/create-platform-release.mjs platform-release.json
          node scripts/validate-platform-release.mjs platform-release.json

      - name: Preserve platform manifest as workflow evidence
        if: inputs.operation != 'rollback-candidate'
        uses: actions/upload-artifact@v4
        with:
          name: fanal-platform-${{ inputs.platform_version }}-${{ inputs.operation }}-${{ github.run_id }}
          path: platform-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send coordinated platform command through SSM
        id: ssm
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail

          case "$REQUESTED_OPERATION" in
            deploy-candidate) REMOTE_ACTION=deploy ;;
            verify-candidate) REMOTE_ACTION=verify ;;
            promote-candidate) REMOTE_ACTION=promote ;;
            rollback-candidate) REMOTE_ACTION=rollback ;;
            *)
              echo "::error::Unsupported platform operation: $REQUESTED_OPERATION"
              exit 64
              ;;
          esac

          if [[ "$REMOTE_ACTION" == "rollback" ]]; then
            printf -v REMOTE_COMMAND \
              'sudo -iu ubuntu /home/ubuntu/fanal/scripts/deploy-platform-release.sh %q' \
              "$REMOTE_ACTION"
          else
            MANIFEST_BASE64=$(base64 -w 0 platform-release.json)
            printf -v REMOTE_COMMAND \
              'sudo -iu ubuntu /home/ubuntu/fanal/scripts/deploy-platform-release.sh %q %q' \
              "$REMOTE_ACTION" \
              "base64:$MANIFEST_BASE64"
          fi

          PARAMETERS=$(jq -cn --arg command "$REMOTE_COMMAND" '{commands: [$command]}')

          if ! SEND_RESULT=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Fanal platform $REQUESTED_OPERATION" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 3600 \
            --output json 2>&1); then
            echo "::error::AWS SSM send-command failed"
            echo "$SEND_RESULT"
            exit 1
          fi

          COMMAND_ID=$(jq -r '.Command.CommandId // empty' <<< "$SEND_RESULT")
          if [[ -z "$COMMAND_ID" ]]; then
            echo "::error::AWS SSM did not return a command ID"
            echo "$SEND_RESULT"
            exit 1
          fi

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "SSM command sent: $COMMAND_ID"

      - name: Wait for coordinated platform command
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${COMMAND_ID:?COMMAND_ID is empty}"

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          for attempt in {1..240}; do
            if ! INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>&1); then
              if grep -q "InvocationDoesNotExist" <<< "$INVOCATION"; then
                echo "Waiting for the SSM invocation to become available..."
                sleep 10
                continue
              fi
              echo "::error::Unable to retrieve the SSM invocation"
              echo "$INVOCATION"
              exit 1
            fi

            STATUS=$(jq -r '.Status // empty' <<< "$INVOCATION")
            STATUS_DETAILS=$(jq -r '.StatusDetails // empty' <<< "$INVOCATION")
            echo "Current status: ${STATUS:-unknown} (${STATUS_DETAILS:-no details})"

            case "$STATUS" in
              Success)
                echo "----- SSM stdout -----"
                jq -r '.StandardOutputContent // empty' <<< "$INVOCATION"
                exit 0
                ;;
              Failed|Cancelled|Cancelling|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|InvalidPlatform|AccessDenied|NoInstancesInTag)
                echo "::error::SSM platform operation failed: ${STATUS_DETAILS:-$STATUS}"
                echo "----- SSM stdout -----"
                jq -r '.StandardOutputContent // empty' <<< "$INVOCATION"
                echo "----- SSM stderr -----"
                jq -r '.StandardErrorContent // empty' <<< "$INVOCATION"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for the platform operation"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true
          exit 1

      - name: Summarize platform operation
        shell: bash
        run: |
          echo "### Fanal platform operation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Operation: \`${{ inputs.operation }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.operation }}" != "rollback-candidate" ]]; then
            echo "- Platform version: \`${{ inputs.platform_version }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Initial feature stage policy: \`test\` (activation remains manual)" >> "$GITHUB_STEP_SUMMARY"
          fi
