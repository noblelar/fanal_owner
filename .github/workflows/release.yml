name: Release Fanal Owner

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable SemVer from package.json (for example, 1.2.3)
        required: true
        type: string
      confirm_release:
        description: Publish the immutable Docker tag, Git tag, and GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  COMPONENT_NAME: Fanal Owner
  IMAGE: fanalarkgroup/fanal_owner
  REGISTRY: docker.io

jobs:
  release:
    name: Publish approved Owner release
    runs-on: ubuntu-latest
    environment: release_env

    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error title=Invalid release ref::Stable releases must be dispatched from the master branch."
            exit 1
          fi

          if [[ "$CONFIRM_RELEASE" != "true" ]]; then
            echo "::error title=Release not confirmed::Run the workflow again and select confirm_release."
            exit 1
          fi

          if [[ ! "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid version::Use a stable Semantic Version in X.Y.Z form."
            exit 1
          fi

          SOURCE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          if [[ "$SOURCE_VERSION" != "$REQUESTED_VERSION" || "$LOCK_VERSION" != "$REQUESTED_VERSION" || "$LOCK_ROOT_VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "::error title=Version mismatch::Requested $REQUESTED_VERSION; package.json=$SOURCE_VERSION, package-lock.json=$LOCK_VERSION, package-lock root=$LOCK_ROOT_VERSION."
            exit 1
          fi

          CHANGELOG_PREFIX="## [$REQUESTED_VERSION] - "
          CHANGELOG_HEADING=$(grep -F "$CHANGELOG_PREFIX" CHANGELOG.md | head -n 1 || true)
          if [[ ! "$CHANGELOG_HEADING" =~ ^##\ \[$REQUESTED_VERSION\]\ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error title=Release notes missing::CHANGELOG.md must contain a dated '## [$REQUESTED_VERSION] - YYYY-MM-DD' section."
            exit 1
          fi

          TAG="v$REQUESTED_VERSION"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
          if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error title=Immutable Git tag conflict::$TAG already points to $TAG_COMMIT instead of $GITHUB_SHA."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error title=Release already published::GitHub Release $TAG already exists."
            exit 1
          fi

          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG_COMMIT" ]]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote the tested commit image
        id: image
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail

          SOURCE_IMAGE="$REGISTRY/$IMAGE:$GITHUB_SHA"
          RELEASE_IMAGE="$REGISTRY/$IMAGE:$RELEASE_VERSION"

          SOURCE_DIGEST=$(docker buildx imagetools inspect "$SOURCE_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')

          if RELEASE_MANIFEST=$(docker buildx imagetools inspect "$RELEASE_IMAGE" --format '{{json .Manifest}}' 2>/dev/null); then
            RELEASE_DIGEST=$(jq -er '.digest' <<< "$RELEASE_MANIFEST")
            if [[ "$RELEASE_DIGEST" != "$SOURCE_DIGEST" ]]; then
              echo "::error title=Immutable Docker tag conflict::$RELEASE_IMAGE already points to $RELEASE_DIGEST instead of $SOURCE_DIGEST."
              exit 1
            fi
          else
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$RELEASE_IMAGE" \
              --metadata-file release-image.json \
              "$SOURCE_IMAGE"
            RELEASE_DIGEST=$(jq -er '."containerimage.descriptor".digest' release-image.json)
          fi

          VERIFIED_DIGEST=$(docker buildx imagetools inspect "$RELEASE_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ "$VERIFIED_DIGEST" != "$SOURCE_DIGEST" ]]; then
            echo "::error title=Image promotion verification failed::Expected $SOURCE_DIGEST but found $VERIFIED_DIGEST."
            exit 1
          fi

          echo "source=$SOURCE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$VERIFIED_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_IMAGE: ${{ steps.image.outputs.release }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail

          awk -v prefix="## [$RELEASE_VERSION] - " '
            index($0, prefix) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > changelog-release-notes.md

          if [[ ! -s changelog-release-notes.md ]]; then
            echo "::error title=Empty release notes::The $RELEASE_VERSION changelog section has no content."
            exit 1
          fi

          {
            echo "Container image: \`$RELEASE_IMAGE@$RELEASE_DIGEST\`"
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            cat changelog-release-notes.md
          } > release-notes.md

      - name: Create annotated Git tag
        if: steps.release.outputs.tag_exists != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$COMPONENT_NAME $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$COMPONENT_NAME $RELEASE_TAG" \
            --notes-file release-notes.md

      - name: Summarize release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_IMAGE: ${{ steps.image.outputs.release }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### $COMPONENT_NAME $RELEASE_TAG published"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Container image: \`$RELEASE_IMAGE@$RELEASE_DIGEST\`"
            echo "- Git tag: \`$RELEASE_TAG\`"
            echo "- Production deployment changed: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"
